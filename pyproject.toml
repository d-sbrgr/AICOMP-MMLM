[project]
name = "aicomp-mmlm"
version = "0.1.0"
description = "Solving the March Machine Learning Mania 2025 Kaggle competition"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Luca Kyburz", email = "luca.kyburz@stud.hslu.ch"},
    {name = "Dave Schurtenberger", email = "david.schurtenberger@stud.hslu.ch"},
]
dependencies = [
    "pandas>=2.3.2",
    "matplotlib>=3.8.0",
    "numpy>=1.26.4",
    "seaborn>=0.13.2",
    "ipykernel>=6.30.1",
    "scipy>=1.16.2",
    "statsmodels>=0.14.5",
    "wandb>=0.22.2",
    "jupyterlab>=4.4.9",
    "notebook>=7.4.7",
    "xgboost>=3.0.5",
    "scikit-learn>=1.7.2",
    "python-dotenv>=1.1.1",
    "pre-commit>=4.3.0",
    "catboost>=1.2.8",
    "torch>=2.0.0",
    "lightning>=2.0.0",
    "dotenv>=0.9.9",
    "ruff>=0.14.1",
]

[dependency-groups]
lint = [
    "ruff>=0.14.1"
]
